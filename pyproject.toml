[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-support-agent"
version = "0.1.0"
description = "Terminal customer-support agent for Kestrel Cycles (take-home)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["kestrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
